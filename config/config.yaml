paths:
  raw_data: "data/raw/raw_data.csv"
  clean_data: "data/interim/clean_data.csv"
  removed_rows: "outputs/reports/removed_rows.csv"
  cleaning_summary: "outputs/reports/cleaning_summary.json"
  processed_data: "data/processed/model_data.csv"
  feature_summary: "outputs/reports/feature_summary.json"
  model_path: "models/house_price_stacking_pipeline.pkl"
  metrics_path: "outputs/metrics/training_metrics.json"
  evaluation_metrics: "outputs/metrics/evaluation_metrics.json"
  error_analysis: "outputs/reports/error_analysis.csv"
  error_by_district: "outputs/reports/error_by_district.csv"
  error_by_location: "outputs/reports/error_by_location.csv"
  error_by_rooms: "outputs/reports/error_by_rooms.csv"

schema:
  columns:
    - district
    - location
    - rooms
    - area
    - floor
    - total_floors
    - price

validation:
  rooms:
    min: 1
    max: 10

  area:
    min: 15
    max: 500

  floor:
    min: 1

  total_floors:
    min: 1
    max: 60

  price:
    min: 10000
    max: 2000000
  
model:
  test_size: 0.2
  random_state: 17